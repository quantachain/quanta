# Prometheus configuration for QUANTA TESTNET (3 Nodes)

global:
  scrape_interval: 5s # Faster scrape for testnet
  evaluation_interval: 10s
  external_labels:
    cluster: 'quanta-testnet'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets: []

# Scrape configurations
scrape_configs:
  # QUANTA Node 1
  - job_name: 'quanta-node1'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['node1:3001']
        labels:
          node: 'node1'
          environment: 'testnet'

  # QUANTA Node 2
  - job_name: 'quanta-node2'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['node2:3002']
        labels:
          node: 'node2'
          environment: 'testnet'

  # QUANTA Node 3
  - job_name: 'quanta-node3'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['node3:3003']
        labels:
          node: 'node3'
          environment: 'testnet'

  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

# Alerting rules
rule_files:
  - 'alerts.yml'
