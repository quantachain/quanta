# Prometheus Alert Rules for QUANTA TESTNET

groups:
  - name: quanta_node_alerts
    interval: 10s
    rules:
      # Node is down
      - alert: NodeDown
        expr: up{job=~"quanta-node.*"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "QUANTA node {{ $labels.node }} is down"
          description: "Node {{ $labels.node }} has been down for more than 1 minute."

      # Low peer count (Adjusted for Testnet:warn if Isolated)
      - alert: LowPeerCount
        expr: quanta_peer_count < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Low peer count on {{ $labels.node }}"
          description: "Node has 0 peers (Isolated)."

      # Chain is not syncing
      - alert: ChainNotSyncing
        expr: rate(quanta_chain_height[2m]) == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Chain not syncing on {{ $labels.node }}"
          description: "Chain height has not increased in 5 minutes."
