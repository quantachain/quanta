version: '3.8'

services:
  # ========================================
  # Node 1 - Bootstrap Node
  # ========================================
  node1:
    image: xd637/quanta-node:v0.1
    container_name: quanta-node-1
    hostname: node1
    ports:
      - "3001:3001" # API
      - "8331:8331" # P2P
      - "7781:7781" # RPC
      - "9091:9091" # Metrics
    volumes:
      - ./node1/quanta.toml:/home/quanta/quanta.toml:ro
      - ./node1/data:/home/quanta/quanta_data
    environment:
      - RUST_LOG=info
      - QUANTA_NODE_NAME=node1
    command: [ "/usr/local/bin/quanta", "start", "-c", "/home/quanta/quanta.toml" ]
    networks:
      - quanta-testnet
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3001/health" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Node 2 - Peer
  # ========================================
  node2:
    image: xd637/quanta-node:v0.1
    container_name: quanta-node-2
    hostname: node2
    ports:
      - "3002:3002"
      - "8332:8332"
      - "7782:7782"
      - "9092:9092"
    volumes:
      - ./node2/quanta.toml:/home/quanta/quanta.toml:ro
      - ./node2/data:/home/quanta/quanta_data
    environment:
      - RUST_LOG=info
      - QUANTA_NODE_NAME=node2
    depends_on:
      node1:
        condition: service_healthy
    command: [ "/usr/local/bin/quanta", "start", "-c", "/home/quanta/quanta.toml" ]
    networks:
      - quanta-testnet

  # ========================================
  # Node 3 - Peer
  # ========================================
  node3:
    image: xd637/quanta-node:v0.1
    container_name: quanta-node-3
    hostname: node3
    ports:
      - "3003:3003"
      - "8333:8333"
      - "7783:7783"
      - "9093:9093"
    volumes:
      - ./node3/quanta.toml:/home/quanta/quanta.toml:ro
      - ./node3/data:/home/quanta/quanta_data
    environment:
      - RUST_LOG=info
      - QUANTA_NODE_NAME=node3
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_started
    command: [ "/usr/local/bin/quanta", "start", "-c", "/home/quanta/quanta.toml" ]
    networks:
      - quanta-testnet

  # ========================================
  # Monitoring Stack
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: quanta-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    networks:
      - quanta-testnet

  grafana:
    image: grafana/grafana:latest
    container_name: quanta-grafana
    volumes:
      - ../monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=quanta2026
    ports:
      - "3000:3000"
    networks:
      - quanta-testnet

networks:
  quanta-testnet:
    driver: bridge
