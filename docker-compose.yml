version: '3.8'

services:
  # ========================================
  # Quanta Node - Main Service
  # ========================================
  quanta-node:
    build: .
    container_name: quanta-node
    hostname: quanta-node
    ports:
      - "3000:3000" # API port
      - "8333:8333" # P2P network port
      - "7782:7782" # RPC port
      - "9090:9090" # Metrics port
    volumes:
      - quanta_data:/home/quanta/quanta_data
      - ./quanta.toml:/home/quanta/quanta.toml:ro
    environment:
      - RUST_LOG=info
      - QUANTA_NODE_NAME=quanta-node
    command: [ "/usr/local/bin/quanta", "start", "-c", "/home/quanta/quanta.toml" ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - quanta-net

  # ========================================
  # Prometheus - Metrics Collection
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: quanta-prometheus
    ports:
      - "9093:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped
    networks:
      - quanta-net

  # ========================================
  # Grafana - Metrics Visualization
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: quanta-grafana
    ports:
      - "3030:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=quanta2026
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3030
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - quanta-net

networks:
  quanta-net:
    driver: bridge

volumes:
  quanta_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
