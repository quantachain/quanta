version: '3.8'

# ========================================
# QUANTA - Single Node Setup
# Beta v0.1 - Standalone / No peers
# ========================================
# Usage:
#   docker compose -f docker-compose.single.yml up -d
#   docker compose -f docker-compose.single.yml logs -f
#   docker compose -f docker-compose.single.yml down
# ========================================

services:
  quanta-node:
    image: xd637/quanta-node:alpha-v2
    container_name: quanta-node
    hostname: quanta-node-01
    ports:
      - "3000:3000"   # REST API
      - "8333:8333"   # P2P network
      - "7782:7782"   # RPC (CLI control)
      - "9090:9090"   # Prometheus metrics
    volumes:
      - quanta-data:/home/quanta/quanta_data
      - quanta-logs:/home/quanta/logs
      - ./quanta.toml:/home/quanta/quanta.toml:ro
    environment:
      - RUST_LOG=info
      - QUANTA_NODE_NAME=quanta-single-node
    command: ["/usr/local/bin/quanta", "start", "-c", "/home/quanta/quanta.toml"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    restart: unless-stopped
    networks:
      - quanta-net

networks:
  quanta-net:
    driver: bridge

volumes:
  quanta-data:
    driver: local
  quanta-logs:
    driver: local
