# QUANTA Node Configuration
version = 1
network_type = "Testnet"

[node]
# API server port
api_port = 3000

# P2P network port
network_port = 8333

# RPC server port (for daemon control)
rpc_port = 7782

# Database path
db_path = "./quanta_data"

# Disable P2P networking (single node mode)
no_network = false

[network]
# Maximum number of peers
max_peers = 125

# Bootstrap peer addresses (comma-separated host:port)
# Testnet bootstrap nodes (Q2 2026 launch)
bootstrap_nodes = [
    # North America
    "testnet-us-east.quanta.network:8333",
    "testnet-us-west.quanta.network:8333",
    
    # Europe
    "testnet-eu-west.quanta.network:8333",
    "testnet-eu-central.quanta.network:8333",
    
    # Asia-Pacific
    "testnet-ap-southeast.quanta.network:8333",
    "testnet-ap-northeast.quanta.network:8333",
    
    # Backup nodes
    "testnet-backup1.quanta.network:8333",
    "testnet-backup2.quanta.network:8333",
]

# DNS seeds for peer discovery (domain names that resolve to peer IPs)
# These will return multiple IP addresses for decentralized discovery
dns_seeds = ["seed.testnet.quantachain.org"]

[consensus]
max_block_transactions = 2000
max_block_size_bytes = 1048576
min_transaction_fee_microunits = 100
transaction_expiry_blocks = 8640
coinbase_maturity = 100

[security]
max_mempool_size = 5000
transaction_expiry_seconds = 86400
enable_rate_limiting = true
rate_limit_per_minute = 60
enable_peer_banning = true
require_tls = false

[mining]
year_1_reward_microunits = 100000000
annual_reduction_percent = 15
min_reward_microunits = 5000000
blocks_per_year = 3153600
bootstrap_phase_blocks = 315360
mining_reward_lock_percent = 50
mining_reward_lock_blocks = 157680
fee_burn_percent = 70
fee_treasury_percent = 20
fee_validator_percent = 10
target_block_time = 10
difficulty_adjustment_interval = 2016

[metrics]
enabled = true
port = 9090

