# ========================================
# QUANTA Node Configuration
# ========================================
# Version: 2.0.0
# Last Updated: 2026-05-28
# This configuration matches the current codebase structure
# For standalone/development nodes without bootstrap infrastructure
# ========================================

version = 1
network_type = "Testnet"

# Consensus engine: proof_of_work | bft
consensus_engine = "bft"

# ========================================
# Node Settings
# ========================================
[node]
# API server port - REST API for wallet interactions
api_port = 3000

# P2P network port - For peer-to-peer communication
network_port = 8333

# RPC server port - For daemon control and monitoring
rpc_port = 7782

# Database path - Where blockchain data is stored
db_path = "./quanta_data"

# Disable P2P networking - Set to true for standalone/local testing
# When true, node runs in isolation without connecting to peers
no_network = false

# Node storage mode:
#   archive  - Keep ALL blocks forever (block explorer, full history)  [default]
#   pruned   - Keep only recent N days of blocks (validator, saves disk)
#   light    - Keep only block headers (minimal footprint, can't serve blocks)
mode = "archive"

# Only used when mode = "pruned": how many days of blocks to retain
prune_days = 30

# ========================================
# Network Settings
# ========================================
[network]
# Maximum number of peers to connect to
max_peers = 125

# Bootstrap peer addresses - Initial peers to connect to on startup
# Currently EMPTY as no bootstrap infrastructure exists yet
# Add peer addresses here when available: ["ip:port", "ip:port"]
bootstrap_nodes = []

# DNS seeds for peer discovery
# Currently EMPTY as no DNS seed infrastructure exists yet
# Add seed domains here when available: ["seed1.domain", "seed2.domain"]
dns_seeds = []

# ========================================
# Security Settings (Node-local preferences)
# ========================================
[security]
# Maximum number of transactions in mempool
max_mempool_size = 5000

# Transaction expiry in seconds (24 hours)
transaction_expiry_seconds = 86400

# Enable rate limiting on API endpoints
# PRODUCTION: Always set to true
enable_rate_limiting = true

# Maximum requests per minute per IP address
rate_limit_per_minute = 60

# Enable automatic peer banning for malicious behavior
enable_peer_banning = true

# Require TLS for API connections
# PRODUCTION: Set to true for public-facing nodes
require_tls = false

# ========================================
# Metrics & Monitoring
# ========================================
[metrics]
# Enable Prometheus metrics endpoint
enabled = true

# Metrics server port
port = 9090
